[package]
name = "impactmap-analyzer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Offline local Rust and Python dependency impact analyzer"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
rustpython-parser = { version = "0.4", default-features = false, features = ["num-bigint"] }
rustpython-ast = { version = "0.4", default-features = false, features = ["num-bigint", "visitor"] }
toml = "0.8"
quote = "1"

[workspace]
